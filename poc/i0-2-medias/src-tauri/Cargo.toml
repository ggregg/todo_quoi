[package]
name = "poc-medias"
version = "0.1.0"
description = "POC I0-2 : audio (MediaRecorder) et images (canvas) dans la webview"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "poc_medias_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# Dépendances limitées à l'inventaire (docs/02-architecture.md §16).
# Le gabarit de `tauri init` ajoutait `log` et `tauri-plugin-log` : retirés.
[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
