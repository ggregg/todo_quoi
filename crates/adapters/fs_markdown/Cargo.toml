[package]
name = "tq_adapter_fs_markdown"
description = "Adaptateur de stockage TodoQuoi : un fichier Markdown + en-tête TOML par tâche, dans le dossier du drive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Dépendances de l'inventaire (architecture §16) : `toml` pour l'en-tête, `serde` pour le
# (dé)sérialiser, `serde_json` pour manifest.json. `pulldown-cmark` arrivera en I2 avec les notes
# structurées ; en I1 la note est conservée telle quelle.
[dependencies]
tq_domain = { workspace = true }
tq_application = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tq_testing = { workspace = true }

[lints]
workspace = true
